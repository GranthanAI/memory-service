[tool.poetry]
name = "memory-service"
version = "0.1.0"
description = "GraphGPT Memory Service"
authors = ["Antigravity AI"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
aiokafka = "^0.10.0"
redis = {extras = ["hiredis"], version = "^5.0.1"}
pymilvus = "^2.3.5"
cassandra-driver = "^3.29.0"          # Primary source of truth — Cassandra
grpcio = "^1.60.0"
grpcio-tools = "^1.60.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
httpx = "^0.26.0"
prometheus-client = "^0.19.0"
zstandard = "^0.22.0"                 # zstd compression for summary texts (faster than zlib)
pyasyncore = "^1.0.5"                 # Python 3.12 compatibility for cassandra-driver


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
black = "^24.1.1"
flake8 = "^7.0.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
