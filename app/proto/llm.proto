syntax = "proto3";

package llm;

service LLMService {
    rpc Summarize(SummaryRequest) returns (SummaryResponse);
    rpc ExtractFacts(FactRequest) returns (FactResponse);
}

message LLMMessage {
    string role = 1;
    string content = 2;
}

message SummaryRequest {
    string previous_summary = 1;
    repeated LLMMessage new_messages = 2;
}

message SummaryResponse {
    string summary = 1;
}

message FactRequest {
    string summary = 1;
}

message ExtractedFact {
    string category = 1;
    float importance = 2;
    string statement = 3;
}

message FactResponse {
    repeated ExtractedFact facts = 1;
}
