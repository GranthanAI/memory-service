syntax = "proto3";

package memory;

service MemoryService {
  // Fetch all relevant memory context for a conversation
  rpc GetMemoryContext(GetMemoryContextRequest) returns (GetMemoryContextResponse);

  // Fetch only short-term conversation history
  rpc GetShortTermMemory(GetShortTermMemoryRequest) returns (GetShortTermMemoryResponse);
}

enum MemoryScope {
  SHORT_TERM = 0;
  MEDIUM = 1;
  LONG_TERM = 2;
  SEMANTIC = 3;
  ALL = 4;
}

message GetMemoryContextRequest {
  string conversation_id = 1;
  string user_id = 2;
  string query = 3;           // for semantic memory retrieval
  MemoryScope scope = 4;      // SHORT_TERM | MEDIUM | LONG_TERM | SEMANTIC | ALL
  int32 max_tokens = 5;       // token budget for memory section
  string trace_id = 6;
  // Branch lineage of the conversation (root first, direct parent last), as resolved by conversation-service.
  // upto_message_id is the last message of that ancestor in scope at the branch point. Additive: absent = not a
  // branch (or an older caller), in which case no ancestor summary is returned.
  repeated AncestorRef ancestors = 7;
}

message AncestorRef {
  string conversation_id = 1;
  string upto_message_id = 2;
}

message GetShortTermMemoryRequest {
  string conversation_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string trace_id = 4;
}

message Message {
  string role = 1;            // "user" | "assistant" | "system" | "tool"
  string content = 2;
  int64 timestamp = 3;
  string message_id = 4;
}

message Fact {
  string content = 1;
  float confidence = 2;
  string category = 3;
  int64 last_updated = 4;
  string fact_id = 5;         // stable identity of the stored fact
}

// Summary of an ancestor conversation that is valid at the child's branch point: it incorporates no
// message after upto_message_id. Summaries that go beyond the branch point are never returned.
message AncestorSummary {
  string conversation_id = 1;
  string summary = 2;
  string covers_through_message_id = 3;
  int32 summary_version = 4;
}

message SemanticSnippet {
  string content = 1;
  float relevance_score = 2;
  string source_message_id = 3;
}

message GetMemoryContextResponse {
  repeated Message short_term_messages = 1;
  string medium_summary = 2;
  repeated Fact long_term_facts = 3;
  repeated SemanticSnippet semantic_snippets = 4;
  int32 total_tokens = 5;
  string request_id = 6;
  repeated AncestorSummary ancestor_summaries = 7;   // branch-valid, root first
  int32 summary_version = 8;                         // version of medium_summary
  string summary_through_message_id = 9;             // last message medium_summary incorporates
}

message GetShortTermMemoryResponse {
  repeated Message messages = 1;
  int32 total_tokens = 2;
  string request_id = 3;
}
